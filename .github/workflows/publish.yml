name: Check and publish Artemis II
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artemis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build for browser tests
        run: pnpm build
        env:
          ASSET_BASE: http://127.0.0.1:4173/
      - run: pnpm test
      - run: pnpm test:browser
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Build production release
        run: pnpm build
      - run: pnpm test
      - name: Upload reviewed build
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
