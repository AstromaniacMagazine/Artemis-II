
  
    <!-- Artemis II Mission Report: Around The Moon For All Humanity Section Module for Squarespace -->
<section class="am2-trailer" id="am2-around-moon" aria-labelledby="am2TrailerTitle">
  <div class="am2-trailer__frame" data-am2-trailer-frame="">
    <video class="am2-trailer__video" data-am2-trailer-video="" muted loop playsinline webkit-playsinline="" preload="metadata" poster="https://images-assets.nasa.gov/image/art002e009288/art002e009288~medium.jpg" controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture="">
      <source media="(max-width: 760px)" data-src="https://images-assets.nasa.gov/video/Around%20the%20Moon%20for%20All%20Humanity%20Artemis%20II%20(Official%20Launch%20Trailer)/Around%20the%20Moon%20for%20All%20Humanity%20Artemis%20II%20(Official%20Launch%20Trailer)~mobile.mp4" type="video/mp4">
      <source media="(max-width: 1200px)" data-src="https://images-assets.nasa.gov/video/Around%20the%20Moon%20for%20All%20Humanity%20Artemis%20II%20(Official%20Launch%20Trailer)/Around%20the%20Moon%20for%20All%20Humanity%20Artemis%20II%20(Official%20Launch%20Trailer)~medium.mp4" type="video/mp4">
      <source data-src="https://images-assets.nasa.gov/video/Around%20the%20Moon%20for%20All%20Humanity%20Artemis%20II%20(Official%20Launch%20Trailer)/Around%20the%20Moon%20for%20All%20Humanity%20Artemis%20II%20(Official%20Launch%20Trailer)~large.mp4" type="video/mp4">

    <div class="am2-trailer__shade" aria-hidden="true"></div>

    <div class="am2-trailer__copy">
      <p class="am2-trailer__eyebrow">Official NASA Launch Trailer</p>
      <h2 class="am2-trailer__title" id="am2TrailerTitle">Around The Moon For All Humanity</h2>
      <p class="am2-trailer__text">A full-width cinematic pause before the story moves from launch imagery into the crew sequence.</p>
    </div>

    <div class="am2-trailer__controls" aria-label="Around The Moon video controls">
      <button class="am2-trailer__btn" type="button" data-am2-trailer-play="" aria-label="Pause Around The Moon video">
        <svg class="am2-trailer__pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3" height="14" rx="1" /><rect x="14" y="5" width="3" height="14" rx="1" /></svg>
        <svg class="am2-trailer__play" viewBox="0 0 24 24" aria-hidden="true"><polygon points="8 5 19 12 8 19" /></svg>

      <button class="am2-trailer__btn is-muted" type="button" data-am2-trailer-mute="" aria-label="Unmute Around The Moon video">
        <svg class="am2-trailer__sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z" /><path d="M16 9.5c.95 1.28.95 3.72 0 5" /><path d="M18.7 7c2.05 2.72 2.05 7.28 0 10" /></svg>
        <svg class="am2-trailer__muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z" /><path d="M18 10l-4 4" /><path d="M14 10l4 4" /></svg>

<style>
  @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap");

  .am2-trailer,
  .am2-trailer * {
    box-sizing: border-box;
  }

  .am2-trailer {
    --am2t-cream: #E0E0DB;
    --am2t-navy: #253551;
    --am2t-dark: #2A2829;
    --am2t-blue: #9eb7ff;
    position: relative;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    color: var(--am2t-cream);
    background: #050608;
    font-family: "Manrope", sans-serif;
    isolation: isolate;
  }

  .am2-trailer__frame {
    position: relative;
    width: 100vw;
    height: clamp(620px, 86vh, 940px);
    margin-left: calc(50% - 50vw);
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(158, 183, 255, .18), transparent 32%),
      linear-gradient(135deg, #050608, #111923 52%, #050608);
    --am2tProgress: 0;
  }

  .am2-trailer__video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    opacity: .9;
    transform:
      scale(calc(1.045 - (var(--am2tProgress) * .025)))
      translate3d(0, calc(var(--am2tProgress) * -14px), 0);
    filter: saturate(1.04) contrast(1.08) brightness(.84);
    transition: opacity .6s ease, filter .6s ease;
  }

  .am2-trailer.is-unmuted .am2-trailer__video {
    opacity: .98;
    filter: saturate(1.08) contrast(1.08) brightness(.92);
  }

  .am2-trailer__shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.28) 44%, rgba(0,0,0,.70)),
      linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.16) 48%, rgba(0,0,0,.68));
    pointer-events: none;
  }

  .am2-trailer__texture {
    position: absolute;
    inset: 0;
    z-index: 2;
    opacity: .34;
    pointer-events: none;
    mix-blend-mode: screen;
    background-image:
      radial-gradient(circle, rgba(224, 224, 219, .36) 0 1px, transparent 1.5px),
      linear-gradient(100deg, transparent 0 42%, rgba(224,224,219,.10) 48%, transparent 54%),
      repeating-linear-gradient(0deg, transparent 0 4px, rgba(224,224,219,.10) 5px);
    background-size: 120px 120px, 260% 100%, 100% 7px;
    animation: am2TrailerTexture 18s linear infinite;
  }

  .am2-trailer__copy {
    position: absolute;
    z-index: 3;
    left: max(18px, 7vw);
    bottom: max(116px, 18vh);
    width: min(760px, calc(100% - 36px));
    transform:
      translate3d(0, calc(24px - (var(--am2tProgress) * 36px)), 0)
      scale(calc(.985 + (var(--am2tProgress) * .025)));
    opacity: calc(.72 + (var(--am2tProgress) * .28));
  }

  .am2-trailer__eyebrow {
    margin: 0 0 10px;
    color: rgba(224, 224, 219, .76);
    font-size: .76rem;
    font-weight: 500;
    letter-spacing: .30em;
    text-transform: uppercase;
  }

  .am2-trailer__title {
    margin: 0;
    color: var(--am2t-cream);
    font-size: clamp(2rem, 5.2vw, 5.8rem);
    line-height: .88;
    font-weight: 300;
    letter-spacing: .055em;
    text-wrap: balance;
    text-shadow:
      0 24px 70px rgba(0,0,0,.75),
      0 0 46px rgba(158,183,255,.20);
  }

  .am2-trailer__title::after {
    content: "";
    display: block;
    width: min(270px, 44vw);
    height: 1px;
    margin-top: 18px;
    background: linear-gradient(90deg, rgba(224,224,219,.90), rgba(158,183,255,.92), rgba(224,224,219,0));
    animation: am2TrailerLine 2.8s ease-in-out infinite;
  }

  .am2-trailer__text {
    max-width: 560px;
    margin: 18px 0 0;
    color: rgba(224, 224, 219, .78);
    font-size: clamp(.9rem, 1.25vw, 1.05rem);
    line-height: 1.58;
    letter-spacing: .07em;
  }

  .am2-trailer__controls {
    position: absolute;
    z-index: 5;
    right: max(16px, 4vw);
    bottom: max(28px, 5vh);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 7px;
    border: 1px solid rgba(224, 224, 219, .34);
    border-radius: 999px;
    background: rgba(0, 0, 0, .58);
    backdrop-filter: blur(16px);
    animation: am2TrailerGlow 2.7s ease-in-out infinite;
  }

  .am2-trailer__btn {
    width: 56px;
    height: 56px;
    display: inline-grid;
    place-items: center;
    border: 1px solid rgba(224, 224, 219, .22);
    border-radius: 50%;
    color: var(--am2t-cream);
    background: rgba(224, 224, 219, .10);
    cursor: pointer;
    transition: transform .22s ease, background .22s ease, border-color .22s ease;
  }

  .am2-trailer__btn:hover {
    transform: translateY(-2px) scale(1.06);
    background: rgba(224, 224, 219, .22);
    border-color: rgba(224, 224, 219, .56);
  }

  .am2-trailer__controls.is-volume-open [data-am2-trailer-volume] {
    border-color: rgba(158,183,255,.72);
    background: rgba(158,183,255,.20);
    box-shadow: 0 0 18px rgba(158,183,255,.34);
  }

  .am2-trailer__btn svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .am2-trailer__bars {
    display: inline-flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    width: 20px;
    height: 18px;
  }

  .am2-trailer__bars i {
    display: block;
    width: 2px;
    border-radius: 999px;
    background: currentColor;
    box-shadow: 0 0 8px rgba(224,224,219,.22);
  }

  .am2-trailer__bars i:nth-child(1) { height: 6px; }
  .am2-trailer__bars i:nth-child(2) { height: 9px; }
  .am2-trailer__bars i:nth-child(3) { height: 12px; }
  .am2-trailer__bars i:nth-child(4) { height: 15px; }
  .am2-trailer__bars i:nth-child(5) { height: 18px; }

  .am2-trailer__play,
  .am2-trailer__pause {
    fill: currentColor !important;
    stroke: none !important;
  }

  .am2-trailer__play,
  .am2-trailer__sound,
  .am2-trailer.is-paused .am2-trailer__pause,
  .am2-trailer.is-unmuted .am2-trailer__muted {
    display: none;
  }

  .am2-trailer.is-paused .am2-trailer__play,
  .am2-trailer.is-unmuted .am2-trailer__sound {
    display: block;
  }

  .am2-trailer__volume {
    display: inline-flex;
    align-items: center;
    width: 0;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
    transition: width .24s ease, opacity .18s ease;
  }

  .am2-trailer__controls.is-volume-open .am2-trailer__volume {
    width: 94px;
    opacity: 1;
    pointer-events: auto;
  }

  .am2-trailer__volume input {
    width: 88px;
    min-width: 88px;
    accent-color: var(--am2t-cream);
    cursor: pointer;
  }

  .am2-trailer__progress {
    position: absolute;
    z-index: 5;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: rgba(224, 224, 219, .12);
  }

  .am2-trailer__progress span {
    display: block;
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--am2t-cream), var(--am2t-blue), transparent);
    box-shadow: 0 0 24px rgba(158, 183, 255, .48);
  }

  @keyframes am2TrailerTexture {
    from { background-position: 0 0, 0 0, 0 0; }
    to { background-position: 120px -120px, 120% 0, 0 70px; }
  }

  @keyframes am2TrailerLine {
    0%, 100% { transform: scaleX(.45); opacity: .32; transform-origin: left; }
    50% { transform: scaleX(1); opacity: .92; transform-origin: left; }
  }

  @keyframes am2TrailerGlow {
    0%, 100% { box-shadow: 0 0 18px rgba(158,183,255,.12); }
    50% { box-shadow: 0 0 0 5px rgba(158,183,255,.08), 0 0 34px rgba(158,183,255,.34); }
  }

  @media (max-width: 860px) {
    .am2-trailer__frame {
      height: 680px;
    }

    .am2-trailer__video {
      object-fit: cover;
      opacity: .94;
    }

    .am2-trailer__shade {
      background:
        linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.28) 38%, rgba(0,0,0,.86)),
        radial-gradient(circle at 32% 24%, rgba(158,183,255,.18), transparent 36%);
    }

    .am2-trailer__copy {
      left: 12px;
      right: 12px;
      bottom: 112px;
      width: auto;
    }

    .am2-trailer__title {
      font-size: clamp(1.95rem, 10vw, 3.45rem);
      letter-spacing: .025em;
    }

    .am2-trailer__text {
      max-width: 96%;
      margin-top: 12px;
      font-size: .86rem;
      line-height: 1.45;
    }

    .am2-trailer__controls {
      right: 12px;
      bottom: 28px;
    }

    .am2-trailer__btn {
      width: 50px;
      height: 50px;
    }

    .am2-trailer__controls.is-volume-open .am2-trailer__volume {
      width: 72px;
    }

    .am2-trailer__volume input {
      width: 68px;
      min-width: 68px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .am2-trailer__texture,
    .am2-trailer__title::after,
    .am2-trailer__controls {
      animation: none !important;
    }

    .am2-trailer__video,
    .am2-trailer__copy,
    .am2-trailer__btn {
      transition: none !important;
      transform: none !important;
    }
  }
</style>

<script>
  (function () {
    var root = document.getElementById("am2-around-moon");
    if (!root || root.getAttribute("data-am2-trailer-ready") === "true") return;
    root.setAttribute("data-am2-trailer-ready", "true");

    var frame = root.querySelector("[data-am2-trailer-frame]");
    var video = root.querySelector("[data-am2-trailer-video]");
    var controls = root.querySelector(".am2-trailer__controls");
    var playButton = root.querySelector("[data-am2-trailer-play]");
    var muteButton = root.querySelector("[data-am2-trailer-mute]");
    var volumeButton = root.querySelector("[data-am2-trailer-volume]");
    var volumeRange = root.querySelector("[data-am2-trailer-volume-range]");
    var progress = root.querySelector("[data-am2-trailer-progress]");
    var hasLoaded = false;
    var userPaused = false;
    var allowScrollFx = !window.matchMedia("(max-width: 760px), (prefers-reduced-motion: reduce)").matches;

    function loadVideo() {
      if (hasLoaded || !video) return;
      var sources = Array.prototype.slice.call(video.querySelectorAll("source[data-src]"));
      sources.forEach(function (source) {
        source.src = source.getAttribute("data-src");
        source.removeAttribute("data-src");
      });
      if (sources.length) {
        video.load();
      }
      hasLoaded = true;
    }

    function syncState() {
      if (!video) return;
      root.classList.toggle("is-paused", video.paused);
      root.classList.toggle("is-unmuted", !video.muted);
      if (playButton) playButton.setAttribute("aria-label", video.paused ? "Play Around The Moon video" : "Pause Around The Moon video");
      if (muteButton) muteButton.setAttribute("aria-label", video.muted ? "Unmute Around The Moon video" : "Mute Around The Moon video");
      if (volumeRange && Number(volumeRange.value) !== video.volume) volumeRange.value = String(video.volume);
    }

    function playVideo() {
      if (!video || userPaused) return;
      loadVideo();
      video.play().then(syncState).catch(syncState);
    }

    playButton?.addEventListener("click", function () {
      loadVideo();
      if (video.paused) {
        userPaused = false;
        video.play().then(syncState).catch(syncState);
      } else {
        userPaused = true;
        video.pause();
        syncState();
      }
    });

    muteButton?.addEventListener("click", function () {
      loadVideo();
      if (video.muted && volumeRange && Number(volumeRange.value) === 0) {
        video.volume = .65;
        volumeRange.value = ".65";
      }
      video.muted = !video.muted;
      if (!video.paused) {
        video.play().catch(function () {});
      }
      syncState();
    });

    volumeButton?.addEventListener("click", function () {
      controls?.classList.toggle("is-volume-open");
      volumeButton.setAttribute("aria-label", controls?.classList.contains("is-volume-open") ? "Close Around The Moon video volume control" : "Open Around The Moon video volume control");
      loadVideo();
      if (volumeRange && controls?.classList.contains("is-volume-open")) volumeRange.focus();
    });

    volumeRange?.addEventListener("input", function () {
      if (!video) return;
      loadVideo();
      var nextVolume = Math.max(0, Math.min(1, Number(volumeRange.value || 0)));
      video.volume = nextVolume;
      video.muted = nextVolume === 0;
      if (nextVolume > 0 && video.paused && !userPaused) video.play().catch(function () {});
      syncState();
    });

    video?.addEventListener("timeupdate", function () {
      if (!progress || !video.duration) return;
      progress.style.width = Math.min(100, (video.currentTime / video.duration) * 100).toFixed(2) + "%";
    });

    video?.addEventListener("play", syncState);
    video?.addEventListener("pause", syncState);
    video?.addEventListener("volumechange", syncState);

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          playVideo();
        } else if (video && !video.paused) {
          video.pause();
          syncState();
        }
      });
    }, { threshold: 0.42, rootMargin: "220px 0px 220px 0px" });

    if (frame) observer.observe(frame);

    var ticking = false;
    function updateScrollFx() {
      ticking = false;
      if (!frame) return;
      var rect = frame.getBoundingClientRect();
      var viewport = window.innerHeight || document.documentElement.clientHeight || 1;
      var raw = 1 - Math.abs((rect.top + rect.height / 2) - viewport / 2) / (viewport * .9);
      var progressValue = Math.max(0, Math.min(1, raw));
      frame.style.setProperty("--am2tProgress", progressValue.toFixed(3));
    }

    function requestScrollFx() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(updateScrollFx);
    }

    syncState();
    if (allowScrollFx) {
      window.addEventListener("scroll", requestScrollFx, { passive: true });
      window.addEventListener("resize", requestScrollFx, { passive: true });
      requestScrollFx();
    } else if (frame) {
      frame.style.setProperty("--am2tProgress", ".45");
    }
  })();
</script>
