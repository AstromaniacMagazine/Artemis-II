<script>
  (function () {
    var root = document.querySelector(".am2-posters");
    if (!root || root.dataset.am2PostersReady === "true") return;
    root.dataset.am2PostersReady = "true";

    var bgImage = root.querySelector(".am2-posters__bg[data-src]");
    var audioBlock = root.querySelector("[data-am2-posters-audio]");
    var cards = Array.prototype.slice.call(root.querySelectorAll("[data-am2-poster-card]"));

    function loadImage(image) {
      if (!image || !image.dataset.src) return;
      image.src = image.dataset.src;
      image.removeAttribute("data-src");
    }

    function loadCardPreview(card) {
      loadImage(card && card.querySelector(".am2-poster-card__img--store[data-src]"));
    }

    if (audioBlock) {
      var audio = audioBlock.querySelector("audio");
      var playButton = audioBlock.querySelector("[data-am2-posters-audio-play]");
      var muteButton = audioBlock.querySelector("[data-am2-posters-audio-mute]");
      var volumeButton = audioBlock.querySelector("[data-am2-posters-audio-volume]");
      var volumeRange = audioBlock.querySelector("[data-am2-posters-audio-range]");
      if (audio) audio.volume = volumeRange ? Number(volumeRange.value || 1) : 1;

      function updateVolumeButton() {
        if (!volumeButton) return;
        volumeButton.setAttribute("aria-label", audioBlock.classList.contains("is-volume-open") ? "Close For All Humanity volume control" : "Open For All Humanity volume control");
      }

      updateVolumeButton();

      if (playButton) {
        playButton.addEventListener("click", function () {
          if (!audio) return;
          if (audio.paused) {
            audio.play().then(function () {
              audioBlock.classList.add("is-playing");
            }).catch(function () {
              audioBlock.classList.remove("is-playing");
            });
          } else {
            audio.pause();
            audioBlock.classList.remove("is-playing");
          }
        });
      }

      if (muteButton) {
        muteButton.addEventListener("click", function () {
          if (!audio) return;
          audio.muted = !audio.muted;
          if (!audio.muted && volumeRange && Number(volumeRange.value) === 0) {
            volumeRange.value = "0.65";
            audio.volume = .65;
          }
          audioBlock.classList.toggle("is-muted", audio.muted);
          muteButton.setAttribute("aria-label", audio.muted ? "Unmute For All Humanity audio" : "Mute For All Humanity audio");
        });
      }

      if (volumeButton) {
        volumeButton.addEventListener("click", function () {
          audioBlock.classList.toggle("is-volume-open");
          updateVolumeButton();
        });
      }

      if (volumeRange) {
        volumeRange.addEventListener("input", function () {
          if (!audio) return;
          var nextVolume = Math.max(0, Math.min(1, Number(volumeRange.value || 0)));
          audio.volume = nextVolume;
          audio.muted = nextVolume === 0;
          audioBlock.classList.toggle("is-muted", audio.muted);
          if (muteButton) muteButton.setAttribute("aria-label", audio.muted ? "Unmute For All Humanity audio" : "Mute For All Humanity audio");
        });

        volumeRange.addEventListener("change", function () {
          if (!audio) return;
          if (Number(volumeRange.value) > 0 && audio.muted) {
            audio.muted = false;
            audioBlock.classList.remove("is-muted");
            if (muteButton) muteButton.setAttribute("aria-label", "Mute For All Humanity audio");
          }
        });
      }

      if (audio) {
        audio.addEventListener("ended", function () {
          audioBlock.classList.remove("is-playing");
        });
      }
    }

    cards.forEach(function (card) {
      var preview = card.querySelector(".am2-poster-card__preview");
      if (!preview) return;
      card.addEventListener("pointerenter", function () {
        loadCardPreview(card);
      }, { passive: true });
      preview.addEventListener("focus", function () {
        loadCardPreview(card);
      });
      preview.addEventListener("click", function () {
        loadCardPreview(card);
        cards.forEach(function (item) {
          if (item !== card) item.classList.remove("is-preview");
        });
        card.classList.toggle("is-preview");
      });
    });

    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            loadImage(bgImage);
            return;
          }
          if (!entry.isIntersecting) {
            var clip = audioBlock && audioBlock.querySelector("audio");
            if (clip) clip.pause();
            if (audioBlock) audioBlock.classList.remove("is-playing");
          }
        });
      }, { rootMargin: "380px 0px", threshold: .08 });
      observer.observe(root);
    } else {
      loadImage(bgImage);
    }

  })();
</script>
